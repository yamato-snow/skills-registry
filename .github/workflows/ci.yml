name: CI

# PR と main への push で回す。デプロイジョブは意図的に作っていない
# （Phase 3 は別スコープ。ここでは「マージしてよいか」だけを判定する）
on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、走っている古いジョブを止める。
# PR を連続で更新したときに、無駄な実行が積み上がるのを防ぐ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # テストは SQLite で代用せず実 PostgreSQL に対して回す。
    # JSONB・DISTINCT ON・ILIKE は PostgreSQL 固有で、SQLite で緑にしても
    # 本番の保証にならない
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skills_registry
        ports:
          - 5432:5432
        # これがないと、コンテナ起動直後の「まだ接続を受け付けていない」
        # 瞬間にテストが走って落ちる
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/skills_registry

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff（lint）
        run: ruff check .

      - name: ruff（フォーマット確認）
        # format ではなく --check。CI がコードを書き換えないようにする
        run: ruff format --check .

      - name: pytest とカバレッジ
        # zip_inspector はセキュリティの中核なので別枠で 90% を要求する。
        # 全体の閾値だけだと、他のファイルのカバレッジで薄まって
        # 中核のテストが減っていることに気づけない
        run: |
          pytest --cov --cov-report=term-missing --cov-fail-under=70
          coverage report --include="app/services/zip_inspector.py" --fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存をインストール
        # install ではなく ci。lockfile のとおりに厳密に入れる
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier（フォーマット確認）
        run: npm run format:check

      - name: ビルド
        run: npm run build
